name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: returnet, POSTGRES_PASSWORD: returnet_ci, POSTGRES_DB: returnet}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U returnet" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RETURNET_ENV: test
      RETURNET_AUTH_MODE: dev
      RETURNET_DEV_AUTH_ENABLED: true
      RETURNET_DATABASE_URL: postgresql+psycopg://returnet:returnet_ci@localhost:5432/returnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m ruff check backend
      - run: python -m mypy backend/app
      - run: python -m pytest --cov=backend.app --cov-fail-under=75
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web check
      - run: pnpm --dir apps/web build
      - run: pnpm --dir apps/mobile check
      - run: pnpm --dir infra/cdk check
